name: build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Clean Build
        run: ./gradlew clean build
      - name: Find JAR Artifacts
        run: |
          echo "ARTIFACTS=$(find Core/build/libs -name '*.jar' -type f -print0 | xargs -0 echo) $(find Bukkit/build/libs -name '*.jar' -type f -print0 | xargs -0 echo)" >> $GITHUB_ENV
      - name: Set Commit ID
        run: echo "commit_id=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Create Release and Upload JAR(s)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ env.commit_id }}
          name: PlotSquared-${{ env.commit_id }}
          files: ${{ env.ARTIFACTS }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
